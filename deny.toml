# Dependency policy enforced by `cargo deny check` (`just deny`, and the Dependencies job in CI).
# Advisories come from https://github.com/rustsec/advisory-db. Dependabot only surfaces GHSA
# vulnerabilities, so unmaintained, unsound and yanked findings are only caught here.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Both reach the graph only as dev-dependencies, through restate-sdk -> restate-sdk-shared-core ->
    # jsonwebtoken, for the Docker-backed e2e tests. Nothing ships in the operator binary.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; dev-only via restate-sdk's jsonwebtoken, no fixed rsa release" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint timing; dev-only via restate-sdk's jsonwebtoken" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "BSL-1.0",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
