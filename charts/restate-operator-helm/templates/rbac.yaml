{{- $manageNetworkPolicies := eq (include "controller.manageNetworkPolicies" .) "true" }}
{{- $manageSecretProviderClasses := eq (include "controller.manageSecretProviderClasses" .) "true" }}
{{- if .Values.serviceAccount.create }}
---
# Scoped service account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "controller.fullname" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: true
  {{- end }}

---
# Access for the service account
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "controller.fullname" . }}
rules:
  - resources:
      - restateclusters
      - restateclusters/status
      - restateclusters/finalizers
      - restatedeployments
      - restatedeployments/status
      - restatedeployments/finalizers
      - restatecloudenvironments
      - restatecloudenvironments/status
      - restatecloudenvironments/finalizers
    verbs:
      - get
      - list
      - watch
      - patch
    apiGroups:
      - restate.dev
  - resources:
      - events
    verbs:
      - create
      - patch
    apiGroups:
      - events.k8s.io
  - resources:
      - namespaces
      - services
      - configmaps
      - serviceaccounts
      - poddisruptionbudgets
      {{- if $manageNetworkPolicies }}
      - networkpolicies
      {{- end }}
      - statefulsets
      - persistentvolumeclaims
      - pods
      - jobs
      - securitygrouppolicies
      {{- if $manageSecretProviderClasses }}
      - secretproviderclasses
      {{- end }}
      - replicasets
      - replicasets/scale
    verbs:
      - get
      - list
      - watch
      - create
      - patch
    apiGroups:
      - ''
      - batch
      - apps
      - policy
      {{- if $manageNetworkPolicies }}
      - networking.k8s.io
      {{- end }}
      - vpcresources.k8s.aws
      {{- if $manageSecretProviderClasses }}
      - secrets-store.csi.x-k8s.io
      {{- end }}
  - resources:
      - statefulsets
      {{- if $manageNetworkPolicies }}
      - networkpolicies
      {{- end }}
      - jobs
      - securitygrouppolicies
      {{- if $manageSecretProviderClasses }}
      - secretproviderclasses
      {{- end }}
      - replicasets
    verbs:
      - delete
    apiGroups:
      - batch
      - apps
      {{- if $manageNetworkPolicies }}
      - networking.k8s.io
      {{- end }}
      - vpcresources.k8s.aws
      {{- if $manageSecretProviderClasses }}
      - secrets-store.csi.x-k8s.io
      {{- end }}
  # Per-version autoscaling: the operator manages one HorizontalPodAutoscaler per
  # draining (non-latest) RestateDeployment version, and watches them (owns).
  - resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
    apiGroups:
      - autoscaling
  {{- if .Values.awsPodIdentityAssociationCluster }}
  - resources:
      - podidentityassociations
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
    apiGroups:
      - eks.services.k8s.aws
  {{- end }}
  {{- if .Values.gcpWorkloadIdentity }}
  - resources:
      - iampolicymembers
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
    apiGroups:
      - iam.cnrm.cloud.google.com
  {{- end }}
  - resources:
      - configurations
      - routes
      - revisions
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
    apiGroups:
      - serving.knative.dev
  - resources:
      - configurations/status
      - routes/status
      - revisions/status
    verbs:
      - get
      - list
      - watch
    apiGroups:
      - serving.knative.dev
---
# Binding the ClusterRole to the account
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ include "controller.fullname" . }}
roleRef:
  kind: ClusterRole
  name: {{ include "controller.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
---
# Namespaced access for the service account
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "controller.fullname" . }}
rules:
  - resources:
    - secrets
    verbs:
      - get
      - list
      - watch
    apiGroups:
    - ''
  - resources:
    - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - patch
    apiGroups:
    - apps
---
# Binding the Role to the account
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    namespace: {{ .Release.Namespace }}
    name: {{ include "controller.fullname" . }}
roleRef:
  kind: Role
  name: {{ include "controller.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
