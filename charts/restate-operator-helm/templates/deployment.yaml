---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controller.fullname" . }}
  labels:
    {{- include "controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controller.selectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: {{ include "controller.fullname" . }}
        {{- if .Values.podAnnotations }}
        {{- toYaml .Values.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "controller.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "controller.fullname" . }}
          image: {{ .Values.image.repository }}:{{ include "controller.tag" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: RUST_LOG
              value: {{ .Values.logging.env_filter }}
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OPERATOR_LABEL_NAME
              value: app
            - name: OPERATOR_LABEL_VALUE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            # Identifies this pod so operator-level events (eg WaitingForCRD) can be
            # attached to it; the uid is what makes them show up in `kubectl describe pod`.
            - name: OPERATOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          {{- if .Values.awsPodIdentityAssociationCluster }}
            - name: AWS_POD_IDENTITY_ASSOCIATION_CLUSTER
              value: {{ .Values.awsPodIdentityAssociationCluster }}
          {{- end }}
          {{- if .Values.gcpWorkloadIdentity }}
            - name: GCP_WORKLOAD_IDENTITY
              value: "true"
          {{- end }}
          {{- if .Values.canaryImage }}
            - name: CANARY_IMAGE
              value: {{ .Values.canaryImage }}
          {{- end }}
          {{- if .Values.clusterDns }}
            - name: CLUSTER_DNS
              value: {{ .Values.clusterDns }}
          {{- end }}
          {{- if .Values.kafkaIntegrationImage }}
            - name: OPERATOR_KAFKA_INTEGRATION_DEFAULT_IMAGE
              value: {{ .Values.kafkaIntegrationImage }}
          {{- end }}
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # /health only says the process is serving; restarting the operator will not make
          # a missing CRD appear, so it is a liveness probe and nothing more.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # /ready is 503 until every controller has its CRD and is reconciling, so an
          # operator whose CRDs were never installed shows up as NotReady.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
