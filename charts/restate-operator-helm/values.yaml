replicaCount: 1
# The operator has no leader election. The default rolling update (25% surge) keeps the old
# pod running next to the new one, and two versions that render a resource differently then
# rewrite it in turn. With maxSurge 0 the old pod gets SIGTERM first and stops taking new work,
# but the new pod can start while it finishes its in-flight reconciles, so a short overlap
# remains. Recreate waits for the old pod to exit, but an existing Deployment cannot switch to
# it through `helm upgrade` with server-side apply (Helm 4): the defaulted rollingUpdate stays.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
nameOverride: "restate-operator"
version: "" # pin a specific version

# install the Restate CRDs (shipped as the optional restate-operator-crds subchart, templated so `helm upgrade` updates the schema); set false to manage them out-of-band (e.g. via the standalone restate-operator-crds chart, or BYOC vendoring)
installCrds: true

image:
  repository: ghcr.io/restatedev/restate-operator
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
podAnnotations: {}

awsPodIdentityAssociationCluster: null
gcpWorkloadIdentity: null
# Azure Workload Identity through Azure Service Operator (ASO), which must be installed. Each RestateCluster that sets
# spec.security.azureWorkloadIdentity gets its own managed identity with access to its own prefix of the snapshot container.
# All four settings are required:
#   identityResourceGroupId: /subscriptions/<id>/resourceGroups/<name>, a resource group that holds only environment identities
#   location: the Azure region the identities are created in, for example swedencentral
#   oidcIssuer: the OIDC issuer URL of the AKS cluster
#   storageContainerId: ARM id of the snapshot container, /subscriptions/<id>/resourceGroups/<name>/providers/Microsoft.Storage/storageAccounts/<account>/blobServices/default/containers/<container>
azureWorkloadIdentity: null
clusterDns: null # defaults to "cluster.local" in the operator binary
canaryImage: null # defaults to "alpine:3.21"; image must provide cat, grep, wget and a CA bundle at /etc/ssl/certs/ca-certificates.crt

podSecurityContext:
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000

logging:
  env_filter: info,restate=debug

env: []

affinity: {}
nodeSelector: {}
tolerations: []

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 100Mi

serviceMonitor:
  enabled: false
  path: /metrics
  scheme: http
