replicaCount: 1
# The operator has no leader election, so two pods must not reconcile at once. The default
# rolling update (25% surge) starts the new pod while the old one still runs, and two versions
# that render a resource differently then rewrite it in turn. maxSurge 0 stops the old pod
# first. Recreate does the same, but an existing Deployment cannot switch to it through
# `helm upgrade` with server-side apply (Helm 4), because the defaulted rollingUpdate stays.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
nameOverride: "restate-operator"
version: "" # pin a specific version

# install the Restate CRDs (shipped as the optional restate-operator-crds subchart, templated so `helm upgrade` updates the schema); set false to manage them out-of-band (e.g. via the standalone restate-operator-crds chart, or BYOC vendoring)
installCrds: true

image:
  repository: ghcr.io/restatedev/restate-operator
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
podAnnotations: {}

awsPodIdentityAssociationCluster: null
gcpWorkloadIdentity: null
clusterDns: null # defaults to "cluster.local" in the operator binary
canaryImage: null # defaults to "alpine:3.21"; image must provide cat, grep, wget and a CA bundle at /etc/ssl/certs/ca-certificates.crt

podSecurityContext:
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000

logging:
  env_filter: info,restate=debug

env: []

affinity: {}
nodeSelector: {}
tolerations: []

service:
  type: ClusterIP
  port: 80

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 100Mi

serviceMonitor:
  enabled: false
  path: /metrics
  scheme: http
