replicaCount: 1
nameOverride: "restate-operator"
version: "" # pin a specific version

# install the Restate CRDs (shipped as the optional restate-operator-crds subchart, templated so `helm upgrade` updates the schema); set false to manage them out-of-band (e.g. via the standalone restate-operator-crds chart, or BYOC vendoring)
installCrds: true

image:
  repository: ghcr.io/restatedev/restate-operator
  pullPolicy: IfNotPresent
  # pins the image (repository:tag@digest), e.g. a moving branch tag; the tag still labels the objects
  digest: ""

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
podAnnotations: {}

awsPodIdentityAssociationCluster: null
gcpWorkloadIdentity: null
clusterDns: null # defaults to "cluster.local" in the operator binary
canaryImage: null # defaults to "alpine:3.21"; image must provide cat, grep, wget and a CA bundle at /etc/ssl/certs/ca-certificates.crt

podSecurityContext:
  fsGroup: 2000
  fsGroupChangePolicy: "OnRootMismatch"
securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000

logging:
  env_filter: info,restate=debug

env: []

affinity: {}
nodeSelector: {}
tolerations: []

service:
  type: ClusterIP
  port: 80

# Sized for the operator's workflow registry (workflowRegistry.mode: operator) too: its
# in-memory index and the lookups the relay sends it. ~a few KB per endpoint, see the
# schemaless docs 58-operator-scale.md.
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

serviceMonitor:
  enabled: false
  path: /metrics
  scheme: http
