[package]
name = "restate-operator"
version = "3.1.0"
authors = ["restate.dev"]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/restatedev/restate-operator"
description = "Restate makes distributed applications easy!"

[[bin]]
doc = false
name = "restate-operator"
path = "src/main.rs"

[[bin]]
doc = false
name = "cluster_crdgen"
path = "src/bin/cluster_crdgen.rs"

[[bin]]
doc = false
name = "cluster_schemagen"
path = "src/bin/cluster_schemagen.rs"

[[bin]]
doc = false
name = "deployment_crdgen"
path = "src/bin/deployment_crdgen.rs"

[[bin]]
doc = false
name = "deployment_schemagen"
path = "src/bin/deployment_schemagen.rs"

[[bin]]
doc = false
name = "cloud_crdgen"
path = "src/bin/cloud_crdgen.rs"

[[bin]]
doc = false
name = "cloud_schemagen"
path = "src/bin/cloud_schemagen.rs"

[lib]
name = "restate_operator"
path = "src/lib.rs"

[features]
default = []
telemetry = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
anyhow = "1.0.100"
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
fnv = "1.0.7"
futures = "0.3.31"
jiff = { version = "0.2.16", features = ["serde"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", features = ["runtime", "client", "derive", "unstable-runtime", ] }
opentelemetry = { version = "0.32.0", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32.1", optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["tokio", "grpc-tonic", "trace"], optional = true }
prometheus = { version = "0.14.0", default-features = false }
prost = "0.14.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde-saphyr = "0.0.29"
sha2 = "0.10.8"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "0.9.8"
tonic = { version = "0.14.2", features = ["channel"] }
tonic-prost = "0.14.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["json", "env-filter"] }
tracing-opentelemetry = { version = "0.33.0", optional = true }
url = { version = "2.5.7", features = ["serde"] }

[build-dependencies]
tonic-prost-build = "0.14.2"

[dev-dependencies]
http = "1"
# Drives real service registration and invocation lifecycle in the Docker-backed
# RestateDeployment introspection e2e tests.
restate-sdk = { version = "0.12.1", default-features = false, features = ["http_server", "rust_crypto"] }
tower = { version = "0.5", features = ["util"] }
