name: Build docker image

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build-docker-image:
    name: Build docker image
    permissions:
      contents: read
      packages: write
    # this workflow is from the restate repo, so we pin the revision to
    # protect ourselves from unexpected changes that might impact CI in
    # this repo.
    uses: restatedev/restate/.github/workflows/docker.yml@ef0d6719db9ebae0c35caaa9855dba6991027443
    with:
      cargoPackage: restate-operator
    secrets: inherit
