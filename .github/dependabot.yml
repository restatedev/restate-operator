version: 2

# GitHub Actions are pinned in .github/workflows/actions.lock and updated with
# `gh actions-lock`; a Dependabot bump would leave the lockfile stale.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      # opentelemetry-otlp and tracing-opentelemetry only interoperate with the
      # exact opentelemetry/opentelemetry_sdk minor they were built against.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      # tonic re-exports a specific prost and the generated code must match it,
      # so they only interoperate at the versions they were built against.
      tonic-prost:
        patterns:
          - "tonic*"
          - "prost*"
      # kube and k8s-openapi are coupled; kube's own notes require upgrading
      # them together to avoid conflicts.
      kubernetes:
        patterns:
          - "kube*"
          - "k8s-openapi"
      cargo-nonmajor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # dev-tools carries the Rust toolchain and musl that the binary links
  # statically; the runtime base is pinned by digest.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      docker-base-images:
        patterns:
          - "*"
