version: 2

# GitHub Actions are pinned in .github/workflows/actions.lock and updated with
# `gh actions-lock`; a Dependabot bump would leave the lockfile stale.
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    open-pull-requests-limit: 2
    groups:
      cargo-nonmajor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # dev-tools carries the Rust toolchain and musl that the binary links
  # statically; the runtime base is pinned by digest.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 2
    groups:
      docker-base-images:
        patterns:
          - "*"
